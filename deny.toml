# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
version = 2
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[advisories]
ignore = [
    # The bans below restrict this exception to teloxide -> aquamarine -> proc-macro-error2.
    { id = "RUSTSEC-2026-0173", reason = """
        Teloxide 0.17.0 uses Aquamarine 0.6.0 only behind cfg(doc) for documentation diagrams. \
        proc-macro-error2 is compiled as a host dependency but is not linked into the bot. \
        Reassess when updating Aquamarine or Teloxide.
        """ },
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "allow"
deny = [
    { crate = "proc-macro-error2", wrappers = [
        "aquamarine",
    ], reason = "Only permitted for Teloxide's documentation diagrams; see RUSTSEC-2026-0173 exception." },
    { crate = "aquamarine", wrappers = [
        "teloxide",
    ], reason = "Only permitted for Teloxide's cfg(doc) usage; reassess on Teloxide or Aquamarine updates." },
]
