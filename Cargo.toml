[package]
name = "feedbot"
version = "1.0.0"
authors = ["Ilya Bizyaev <me@ilyabiz.com>"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"

clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
pretty_env_logger = "0.5.0"

futures = "0.3.34"
itertools = "0.15.0"

figment = { version = "0.10.19", features = ["env", "json"] }
serde = { version = "1.0.229", features = ["derive"] }

url = { version = "2.5.8", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
] }
rss = { version = "2.1.2", default-features = false }

tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }
teloxide = { version = "0.17.0", default-features = false, features = [
    "ctrlc_handler",
    "rustls-native-roots",
] }

[profile.release]
lto = true
# https://doc.rust-lang.org/cargo/reference/profiles.html#codegen-units
codegen-units = 1
# https://doc.rust-lang.org/cargo/reference/profiles.html#debug
debug = "line-tables-only"
